[project]
name = "namu-cloud-routing"
version = "0.1.0"
description = "NAMU 공용 라우팅 MCP 서비스 — 요청별 사용자 디렉토리로 포터블 메모리 코어(namu-agent)를 라우팅한다"
requires-python = ">=3.12"
# 코어(vendor/namu-agent/namu-plugin의 config/db/profile)가 요구하는 의존성과 동일 집합 +
# 라우팅 서버 자체(FastMCP stateless HTTP). 코어는 submodule로 재사용하므로 여기 deps에
# 코어를 넣지 않는다(sys.path로 import).
# pyjwt[crypto]/httpx는 신원 계층(github_app.py)이 **직접** 쓰므로 명시 선언한다.
# 현재 venv에는 다른 패키지의 전이 의존으로 이미 들어와 있지만, 그 패키지가 의존을
# 바꾸면 배포 빌드가 조용히 깨진다.
dependencies = [
    "mcp[cli]>=1.28,<2",
    "python-ulid>=3.0.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0.0",
    "pyjwt[crypto]>=2.8",
    "httpx>=0.27",
    # 티켓 주소로 들어오는 파일 전송(multipart/form-data)을 Starlette가 읽으려면
    # 이 패키지가 있어야 한다. 지금은 다른 패키지에 딸려 들어와 있지만, 그쪽이
    # 의존을 바꾸면 파일 올리기만 조용히 500으로 죽는다 — 명시해 둔다.
    "python-multipart>=0.0.9",
    # 코어(config.now)가 기준 시간대(NAMU_TZ, 기본 Asia/Seoul)로 시각을 적는다.
    # slim 컨테이너에는 OS tz 데이터베이스가 없어 zoneinfo가 실패하고, 그러면 코어가
    # 조용히 컨테이너 현지시각(UTC)으로 폴백해 기록 시각이 9시간 어긋난다.
    "tzdata>=2024.1",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
